name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # The plugin targets Windows path semantics, so test and pack on Windows.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${TAG#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build, and test
        run: npm run check

      - name: Pack npm tarball
        run: npm pack

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Check whether this version is already on npm
        id: npm-version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-env-manager-plugin@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-env-manager-plugin@$version is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dsh-env-manager-plugin-*.tgz
          fail_on_unmatched_files: true
